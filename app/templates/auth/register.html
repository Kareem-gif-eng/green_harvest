{% extends "base.html" %}
{% block title %}إنشاء حساب{% endblock %}
{% block content %}
<h1>إنشاء حساب</h1>
<form method="post" class="card form-narrow">
  {{ csrf_field }}
  <label>الاسم<input name="name" required></label>
  <label>البريد الإلكتروني<input name="email" type="email" required></label>
  <label>كلمة المرور (8 أحرف على الأقل)<input name="password" type="password" minlength="8" required></label>
  <label>نوع الحساب
    <select name="role">
      <option value="farmer">مزارع</option>
      <option value="charity">جمعية خيرية</option>
    </select>
  </label>
  <label>الهاتف<input name="phone"></label>
  <label>المحافظة / المدينة<input name="city"></label>
  <button class="btn btn-block">إنشاء الحساب</button>
</form>
{% endblock %}
